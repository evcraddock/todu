appId: com.todu.app
productName: todu
copyright: Copyright © 2026 todu

artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

directories:
  output: ../../dist/installers
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!dist/**/*.map"

extraMetadata:
  main: dist/main/index.js

# Bundle the matching platform/architecture CLI, not the build host's binary.
# Linux
linux:
  executableName: todu
  syncDesktopName: true
  extraResources:
    - from: "../../dist/cli/todu-cli-linux-${arch}"
      to: cli/todu
  target:
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]
  category: Office
  icon: build/icons
  desktop:
    entry:
      StartupWMClass: todu

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh

# macOS
mac:
  extraResources:
    - from: "../../dist/cli/todu-cli-darwin-${arch}"
      to: cli/todu
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity
  icon: build/icons/icon.icns
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Windows
win:
  extraResources:
    - from: ../../dist/cli/todu-cli-windows-x64.exe
      to: cli/todu.exe
  target:
    - target: nsis
      arch: [x64]
  icon: build/icons/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/win/installer.nsh
  perMachine: true
