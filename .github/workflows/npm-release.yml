name: NPM Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  release:
    name: Publish Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Skip when local versioning is pending
        id: pending-changesets
        shell: bash
        run: |
          shopt -s nullglob
          changesets=(.changeset/*.md)
          pending=()
          for changeset in "${changesets[@]}"; do
            case "$changeset" in
              .changeset/README.md) ;;
              *) pending+=("$changeset") ;;
            esac
          done

          if [ "${#pending[@]}" -gt 0 ]; then
            echo "Versioning is pending and must be done locally before publish."
            printf 'Pending changesets:\n'
            printf -- '- %s\n' "${pending[@]}"
            echo "Run npm run version-packages locally, commit the version changes, and merge that PR to publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish changed packages
        if: steps.pending-changesets.outputs.should_publish == 'true'
        run: npm run release-packages
        env:
          HUSKY: "0"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
