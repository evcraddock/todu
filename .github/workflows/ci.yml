name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare Electron binary
        run: node scripts/install-electron-binary.mjs

      - name: Check (lint + format + typecheck)
        run: make check-ci

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Device registry integration tests
        run: npm run test:all -- packages/engine/src/devices.integration.test.ts packages/daemon/src/protocol-conformance.integration.test.ts

      - name: LAN sync listener integration tests
        run: npm run test:all -- packages/engine/src/sync-listener.integration.test.ts packages/daemon/src/sync-listener.integration.test.ts packages/cli/src/sync-listener-config.integration.test.ts

      - name: Device enrollment integration tests
        run: npm run test:all -- packages/engine/src/enrollment-storage.integration.test.ts packages/daemon/src/enrollment.integration.test.ts

      - name: Sync provider checkpoint and field-group integration tests
        run: npm run test:all -- packages/daemon/src/sync-worker-checkpoint.integration.test.ts packages/daemon/src/sync-field-groups.integration.test.ts

      - name: Daemon shutdown integration tests
        run: npm run test:daemon-shutdown-integration

      - name: Desktop daemon startup integration tests
        run: npm run test:all -- packages/electron/src/main/daemon-connection-manager.integration.test.ts packages/daemon/src/runtime.integration.test.ts

  desktop:
    name: Desktop package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: npm ci
      - name: Prepare Electron binary
        run: node scripts/install-electron-binary.mjs
      - name: Build and validate native desktop package
        shell: bash
        run: |
          make build-cli-binary build-electron
          PLATFORM=$(node -p 'process.platform === "darwin" ? "mac" : "linux"')
          npm run --workspace=packages/electron dist:${PLATFORM}:dir -- --$(node -p process.arch)
          npm run --workspace=packages/electron validate:daemon-bundle:${PLATFORM}
      - name: Device enrollment integration tests
        run: npm run test:all -- packages/engine/src/enrollment-storage.integration.test.ts packages/daemon/src/enrollment.integration.test.ts
      - name: Sync provider checkpoint and field-group integration tests
        run: npm run test:all -- packages/daemon/src/sync-worker-checkpoint.integration.test.ts packages/daemon/src/sync-field-groups.integration.test.ts
      - name: Unix socket ownership and path boundary tests
        run: npm run test:all -- packages/daemon/src/transport.integration.test.ts
      - name: LAN sync listener integration tests
        run: npm run test:all -- packages/engine/src/sync-listener.integration.test.ts packages/daemon/src/sync-listener.integration.test.ts packages/cli/src/sync-listener-config.integration.test.ts
