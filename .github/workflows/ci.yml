name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare Electron binary
        run: node scripts/install-electron-binary.mjs

      - name: Check (lint + format + typecheck)
        run: make check-ci

      - name: Build
        run: make build

      - name: Full test suite (unit + integration + sync servers)
        env:
          HOME: ${{ runner.temp }}/todu-test-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/todu-test-config
          XDG_DATA_HOME: ${{ runner.temp }}/todu-test-data
        run: |
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          make test-all

  desktop:
    name: Desktop package (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: npm ci
      - name: Verify native desktop architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node packages/electron/scripts/macos-support.mjs
          node -e 'require("node:assert/strict").equal(process.arch, process.env.EXPECTED_ARCH)'
      - name: Prepare Electron binary
        run: node scripts/install-electron-binary.mjs
      - name: Build and validate native desktop package
        shell: bash
        run: |
          make build-cli-binary build-electron
          npm run --workspace=packages/electron dist:${{ matrix.platform }}:dir -- --${{ matrix.arch }}
          npm run --workspace=packages/electron validate:daemon-bundle:${{ matrix.platform }}
      - name: Device enrollment integration tests
        run: npm run test:all -- packages/engine/src/enrollment-storage.integration.test.ts packages/daemon/src/enrollment.integration.test.ts
      - name: Sync provider checkpoint and field-group integration tests
        run: npm run test:all -- packages/daemon/src/sync-worker-checkpoint.integration.test.ts packages/daemon/src/sync-field-groups.integration.test.ts
      - name: Unix socket ownership and path boundary tests
        run: npm run test:all -- packages/daemon/src/transport.integration.test.ts
      - name: LAN sync listener selection, publication, and native direct setup tests
        run: npm run test:all -- packages/core/src/sync-listener-enable.test.ts packages/core/src/sync-listener-config.test.ts packages/core/src/enrollment-endpoint.test.ts packages/cli/src/commands/sync-listener.test.ts packages/engine/src/sync-listener.integration.test.ts packages/engine/src/listener-publication.integration.test.ts packages/engine/src/peer-connections.test.ts packages/daemon/src/sync-listener.integration.test.ts packages/daemon/src/listener-setup.integration.test.ts packages/daemon/src/roster-peers.integration.test.ts packages/cli/src/sync-listener-config.integration.test.ts
