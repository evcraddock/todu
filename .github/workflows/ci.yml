name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check (lint + format + typecheck)
        run: make check-ci

      - name: Protocol conformance
        run: npm run test:conformance

      - name: Storage stability
        run: npm run test:storage-stability

      - name: Test
        run: make test

      - name: Build
        run: make build
