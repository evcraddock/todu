name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare Electron binary
        run: node scripts/install-electron-binary.mjs

      - name: Check (lint + format + typecheck)
        run: make check-ci

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Verify CLI install deprecations
        run: npm run verify:cli-install
